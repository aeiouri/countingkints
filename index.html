<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="단수 카운터">
<title>뜨개 단수 카운터</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%A7%B6%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#F1F4F5;--card:#FFFFFF;--ink:#1B2631;--muted:#66727F;--line:#D9E0E5;
  --hl:#FFE94A;--hlsoft:#FFF7B8;--accent:#2E4A78;--accent-soft:#E3EAF5;--done:#E4EEE8;--danger:#BF3A2B;
  --display:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#11161B;--card:#1A2129;--ink:#E7ECF1;--muted:#92A0AD;--line:#2A343E;
    --hlsoft:#4A4310;--accent:#9DBBF0;--accent-soft:#25324A;--done:#1E2D25;--danger:#F08A7C;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11161B;--card:#1A2129;--ink:#E7ECF1;--muted:#92A0AD;--line:#2A343E;
  --hlsoft:#4A4310;--accent:#9DBBF0;--accent-soft:#25324A;--done:#1E2D25;--danger:#F08A7C;color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
#app{flex:1;min-height:0;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.top{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line);min-height:56px;position:relative}
.top.slim{padding:4px 6px;min-height:52px;gap:4px}
.topprog{position:absolute;left:0;bottom:0;height:3px;background:var(--ink);width:0;transition:width .25s}
.partbtn{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:44px;max-width:36%;padding:0 10px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);text-align:left;flex:none}
.partbtn .pj{font-size:11px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.partbtn .pn{font-weight:700;font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ttools{flex:1;min-width:0;display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;padding:2px 2px}
.ttools::-webkit-scrollbar{display:none}
.mbar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--accent-soft);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.msw{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
.msw.on{box-shadow:0 0 0 3px var(--ink)}
.tmain{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.curinfo{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:none;user-select:none;-webkit-user-select:none;text-align:center;padding:0 4px;gap:2px}
.ci1{font:400 19px/1.25 var(--display);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci1 b{font-size:26px;font-weight:400;margin-right:2px}
.ci2{font-size:12px;color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.on{background:var(--ink);color:var(--paper)}
.viewrect{position:absolute;outline:2px dashed #1E88E5;outline-offset:-1px;background:rgba(30,136,229,.08);pointer-events:none}
.viewrect .hd{background:#1E88E5}
.cbox{position:absolute;pointer-events:none}
.slayer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:hidden}
.elayer{position:absolute;inset:0;touch-action:none;cursor:crosshair;pointer-events:auto}
.hbar-sep{flex:none;width:1px;align-self:stretch;background:var(--line)}
.top h1{flex:1;margin:0;font:400 20px/1.2 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{min-width:44px;height:44px;border:0;background:none;font-size:26px;line-height:1;border-radius:12px}
.icon:active{background:var(--line)}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:16px}
.btn{min-height:44px;padding:0 18px;border-radius:12px;border:1.5px solid var(--ink);background:var(--card);font-weight:500}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.4}
.inp{width:100%;min-height:44px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
textarea.inp{min-height:180px;resize:vertical;line-height:1.55}
.muted{color:var(--muted)}
.small{font-size:13px}

/* home */
.hero{font:400 30px/1.25 var(--display);margin:8px 0 4px}
.hero .hlmark{padding:0 2px}
.hlmark{background:linear-gradient(transparent 58%,var(--hl) 58%)}
.sync{font-size:13px;color:var(--muted);margin:0 0 18px}
.pcard{display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.pcard:active{background:var(--accent-soft)}
.pname{font:400 20px/1.3 var(--display)}
.pmeta{font-size:13px;color:var(--muted);margin-top:2px}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}

/* project */
.parts{display:flex;gap:8px;overflow-x:auto;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line);scrollbar-width:none}
.parts::-webkit-scrollbar{display:none}
.pchip{flex:none;min-height:40px;padding:0 16px;border-radius:20px;border:1.5px solid var(--line);background:var(--paper);font-weight:500;white-space:nowrap}
.pchip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pchip.add{border-style:dashed;color:var(--muted)}
.banner{padding:12px 16px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.bannerrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bignum{display:flex;align-items:baseline;gap:3px;background:none;border:0;padding:0;font-family:var(--display);color:var(--ink)}
.bn{font-size:58px;line-height:1;letter-spacing:-.02em}
.dan{font-size:22px}
.of{font:400 14px var(--body);color:var(--muted);margin-left:8px}
.sidebox{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.sideline{font:400 21px/1.2 var(--display)}
.dirchip{display:inline-block;padding:2px 10px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:500}
.prog{height:4px;border-radius:2px;background:var(--line);margin:10px 0 8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);width:0;transition:width .25s}
.lastline{font-size:13px;color:var(--muted)}
.lastline b{color:var(--ink)}
.toolbar{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--paper);scrollbar-width:none;align-items:center}
.toolbar::-webkit-scrollbar{display:none}
.tb{flex:none;min-height:38px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:14px;font-weight:500;white-space:nowrap}
.tb.on{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.legend{display:flex;gap:4px;align-items:center;padding-left:4px;flex:none;font-size:12px;color:var(--muted)}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block}
.chartscroll{overflow-x:auto;overflow-y:hidden;padding:6px 8px}
.chartinner{position:relative;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.chartinner canvas{display:block;width:100%;height:auto}
.ov{position:absolute;inset:0;pointer-events:none}
.tint{position:absolute;left:0;right:0;background:rgba(90,120,100,.24)}
.hl{position:absolute;left:0;right:0;background:rgba(255,233,40,.55);mix-blend-mode:multiply}
.mlayer{position:absolute;inset:0}
.mlayer.edit{pointer-events:auto;cursor:crosshair}
.mline{position:absolute;top:0;bottom:0;width:2px;transform:translateX(-50%);box-shadow:0 0 0 .5px rgba(255,255,255,.75)}
.loading{padding:40px 16px;text-align:center;color:var(--muted)}
.cards{padding:12px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.tcard.cur{background:var(--hlsoft);border-color:#D9B800}
.thead{font:400 20px var(--display);margin-bottom:4px}
.tbody{white-space:pre-wrap;font-size:18px;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;flex-direction:column;align-items:flex-start;min-height:44px;padding:4px 12px;border-radius:12px;border:1.5px solid var(--ink);background:var(--card);line-height:1.25;text-align:left}
.chip .sd{font-size:11px;color:var(--muted)}
.chip .tm{font-size:11px;color:var(--muted)}
.chip.done{background:var(--done);border-color:var(--line)}
.chip.done b::before{content:"✓ "}
.chip.now{box-shadow:0 0 0 3px var(--hl)}
.bottom{display:flex;gap:8px;padding:6px 10px;align-items:stretch;background:var(--card);border-top:1px solid var(--line)}
.arrow{min-height:56px;border-radius:14px;border:1.5px solid var(--ink);background:var(--card);font-size:26px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.arrow.txt{font-size:15px;font-weight:700;line-height:1.2}
.arrow small{display:block;font-size:11px;font-weight:500;opacity:.75;margin-top:2px}
.arrow.prev{flex:0 0 76px}
.arrow.next{flex:0 0 116px;border:0;background:var(--hl);color:#1B2631;box-shadow:0 2px 0 rgba(0,0,0,.25)}

.arrow.next:active{transform:translateY(2px);box-shadow:none}
.arrow:disabled{opacity:.4}

/* layers */
.layer{position:fixed;inset:0;z-index:50;background:rgba(10,16,22,.5);display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.layer.center{align-items:center;padding:16px}
.dlg{width:100%;max-width:420px;background:var(--card);border-radius:18px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.dlg h3{margin:0 0 10px;font:400 20px var(--display)}
.dact{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.sheet{width:100%;max-width:640px;max-height:88%;display:flex;flex-direction:column;background:var(--paper);border-radius:20px 20px 0 0;overflow:hidden}
.sheet.tall{height:94%;max-height:94%}
.sheethead{display:flex;align-items:center;padding:6px 8px 6px 18px;background:var(--card);border-bottom:1px solid var(--line)}
.sheethead h2{flex:1;margin:0;font:400 20px var(--display)}
.sheetbody{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 24px}
.sheetfoot{display:flex;gap:8px;padding:10px 12px;background:var(--card);border-top:1px solid var(--line)}
.sheetfoot .btn{flex:1}
.menuitem{display:block;width:100%;text-align:left;min-height:50px;padding:0 16px;border:0;border-bottom:1px solid var(--line);background:var(--card);font-size:16px}
.menuitem.danger{color:var(--danger)}

/* forms */
.field{margin-bottom:16px}
.field>label,.lab{display:block;font-weight:500;margin-bottom:6px}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:12px;overflow:hidden}
.segb{flex:1;min-height:44px;border:0;background:var(--card);font-weight:500;border-right:1.5px solid var(--ink)}
.segb:last-child{border-right:0}
.segb.on{background:var(--ink);color:var(--paper)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-bottom:16px}
.q .lab{font-size:14px;margin-bottom:2px}
.radios{display:flex;flex-direction:column;gap:0}
.rad{display:flex;align-items:center;gap:8px;min-height:34px;font-size:14px;cursor:pointer}
.rad input{width:18px;height:18px;margin:0;accent-color:var(--accent);flex:none}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.err{color:var(--danger);font-size:14px;margin:8px 0 0}
.preview{margin:-4px 0 16px;padding:8px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:14px;line-height:1.6}
.pager{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.cropscroll{overflow:auto;max-height:72vh;padding:24px;background:var(--paper);border:1px solid var(--line);border-radius:10px}
.sheet.wide{max-width:1100px}
.cropbox{position:relative;width:100%;background:#fff;border:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.cropbox canvas{display:block;width:100%;height:auto;pointer-events:none}
.cropov{position:absolute;inset:0;touch-action:none;cursor:crosshair}
.croprect{position:absolute;outline:2px solid #E0336B;outline-offset:-1px;background:rgba(224,51,107,.06);pointer-events:none}
.cellrect{position:absolute;outline:2px solid #1E88E5;outline-offset:-1px;background:rgba(30,136,229,.3);pointer-events:none}
.croprect svg{position:absolute;inset:0;width:100%;height:100%}
.gl,.gv{stroke:rgba(224,51,107,.35);stroke-width:1;vector-effect:non-scaling-stroke}
.g5{stroke:rgba(224,51,107,.75)}
.hd{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#E0336B;border:3px solid #fff;pointer-events:none}
.rowone{position:absolute;left:4px;padding:0 6px;border-radius:6px;background:#E0336B;color:#fff;font-size:12px;font-weight:700;pointer-events:none}
.hd[data-k=t],.hd[data-k=b]{width:44px;height:10px;margin:-5px 0 0 -22px;border-radius:5px;border-width:2px}
.hd[data-k=l],.hd[data-k=r]{width:10px;height:44px;margin:-22px 0 0 -5px;border-radius:5px;border-width:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{padding:2px 10px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:13px}

/* history */
.sum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.sum .big{font:400 22px/1.3 var(--display)}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.dayhead{padding:10px 14px;background:var(--accent-soft);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.dayhead b{font-weight:700}
.ent{display:flex;align-items:center;gap:8px;padding:6px 14px;border-top:1px solid var(--line);min-height:44px}
.ent .r{font:400 18px var(--display);min-width:56px}
.ent .t{flex:1;font-size:14px;color:var(--muted)}
.ent .dup{font-size:12px;color:var(--danger);font-weight:700}
.x{min-width:40px;height:40px;border:0;background:none;color:var(--muted);font-size:18px;border-radius:10px}
.x:active{background:var(--line)}
.x:disabled{opacity:.25}
#toast{position:fixed;left:50%;transform:translate(-50%,12px);bottom:calc(env(safe-area-inset-bottom,0px) + 100px);z-index:80;display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:14px;background:var(--ink);color:var(--paper);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:92%}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.tbtn{border:0;background:none;color:var(--hl);font-weight:700;min-height:32px;padding:0 4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(() => {
'use strict';
/* ---------- 작은 도구들 ---------- */
const $ = (s, r = document) => r.querySelector(s);
const h = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) { if (kid == null || kid === false) continue; e.append(kid.nodeType ? kid : document.createTextNode(String(kid))); }
  return e;
};
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, '0');
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const fmtDate = t => { const d = new Date(t); return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} (${WD[d.getDay()]})`; };
const md = t => { const d = new Date(t); return `${pad(d.getMonth() + 1)}.${pad(d.getDate())}`; };
const fmtTime = (t, sec) => { const d = new Date(t), H = d.getHours(); return `${H < 12 ? '오전' : '오후'} ${H % 12 || 12}:${pad(d.getMinutes())}${sec ? ':' + pad(d.getSeconds()) : ''}`; };
const rel = t => {
  const s = Math.floor((Date.now() - t) / 1000);
  if (s < 60) return '0분 전';
  const m = Math.floor(s / 60); if (m < 60) return m + '분 전';
  const hr = Math.floor(m / 60); if (hr < 24) return hr + '시간 전';
  return Math.floor(hr / 24) + '일 전';
};
const dayKey = t => { const d = new Date(t); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); };
const dayDiff = (a, b) => { const x = new Date(a), y = new Date(b); x.setHours(0, 0, 0, 0); y.setHours(0, 0, 0, 0); return Math.round((y - x) / 864e5); };
const rangeStr = rows => {
  const r = [...new Set(rows)].sort((a, b) => a - b), out = [];
  for (let i = 0; i < r.length;) { let j = i; while (j + 1 < r.length && r[j + 1] === r[j] + 1) j++; out.push(i === j ? `${r[i]}` : `${r[i]}~${r[j]}`); i = j + 1; }
  return out.join(', ') + '단';
};
const MARK = [null, '#FF6FA8', '#8ED62A', '#FF9A1F', '#3DB8FF'];
const MARK_NAME = [null, '분홍', '연두', '주황', '하늘'];

/* ---------- 저장소 (이 기기 + 로그인 시 동기화) ---------- */
const LS = 'knit.counter.v1', LSUI = 'knit.counter.ui.v1';
let projects = {}, ui = { active: null, part: {}, zoom: {} };
try { projects = JSON.parse(localStorage.getItem(LS) || '{}') || {}; } catch (e) { projects = {}; }
try { ui = Object.assign(ui, JSON.parse(localStorage.getItem(LSUI) || '{}')); } catch (e) {}
ui.part = ui.part || {}; ui.zoom = ui.zoom || {};
const saveLocal = () => { try { localStorage.setItem(LS, JSON.stringify(projects)); } catch (e) {} };
const saveUI = () => { try { localStorage.setItem(LSUI, JSON.stringify(ui)); } catch (e) {} };

let col = null, syncState = 'local', flushT = null;
const dirty = new Set();
function setSync(s) { syncState = s; const el = $('#syncline'); if (el) el.textContent = syncText(); }
function syncText() {
  return ({
    local: '이 기기에만 저장돼요 · 기기 간 동기화는 다음 단계에서 연결돼요',
    synced: '내 계정에 동기화됨 · 다른 기기에서도 이어서 쓸 수 있어요',
    slow: '동기화 서버에 연결 중이에요 · 기록은 이 기기에 먼저 저장돼요',
    error: '동기화에 실패했어요 · 기록은 이 기기에 저장돼 있어요'
